services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-target_info}
      POSTGRES_USER: ${POSTGRES_USER:-target_info}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-target_info} -d ${POSTGRES_DB:-target_info}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-target-info}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  target-info-search:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${TARGET_INFO_PORT:-8000}:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PERSISTENCE_BACKEND: postgres-s3
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-target_info}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-target_info}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-target-info}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-now}
      S3_BUCKET: ${S3_BUCKET:-target-info-search}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # This is a disposable compute cache; PostgreSQL + MinIO are authoritative.
      - app-work-cache:/app/data
      - app-results-cache:/app/results
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  app-work-cache:
  app-results-cache:
